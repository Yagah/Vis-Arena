modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Yagah"
description='''
Minigames for Vis Mod servers: free-for-all, team deathmatch, 1v1 and Core Siege. Server side only.
'''
# Server side only: players join without it, and the server list doesn't flag it as missing.
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="vismod"
    type="required"
    versionRange="${vismod_version_range}"
    ordering="AFTER"
    side="BOTH"
